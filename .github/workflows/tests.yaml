name: Kratix CLI Tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - release-please--branches--main

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
          check-latest: true
      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v4
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SYNTASSO_KRATIX_CLI_PRIVATE_TF_MODULE_TEST_FIXTURE_REPO_DEPLOY_KEY }}
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Run make test
        run: make test

  security-scan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
          check-latest: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Run with JSON output; filter known Fixed-in:N/A vulns before failing.
          # GO-2026-5932: x/crypto/openpgp abandoned — no fix exists; indirect via crossplane
          # GO-2026-5064/5622/5338: containerd v1 CRI vulns — no v1 fix; indirect via helm
          # GO-2026-5709: crossplane signature TOCTOU — no v1.x fix; tracked upstream
          KNOWN_NA="GO-2026-5932|GO-2026-5064|GO-2026-5622|GO-2026-5338|GO-2026-5709"
          OUTPUT=$(govulncheck -format json ./... 2>&1 || true)
          UNEXPECTED=$(echo "$OUTPUT" | jq -r 'select(.finding.osv != null) | .finding.osv' 2>/dev/null \
            | grep -vE "$KNOWN_NA" | sort -u || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected vulnerabilities found:"
            echo "$UNEXPECTED"
            govulncheck ./...
            exit 1
          fi
          echo "govulncheck passed (known N/A vulns suppressed)"

  update-release-pr:
    runs-on: ubuntu-latest
    needs: [unit-test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm install -g release-please
      - name: Create pending releases
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.RELEASE_CREATOR_TOKEN }}
        run: |
          release-please \
            --token=$TOKEN \
            --repo-url=syntasso/kratix-cli \
            github-release
      - name: Update Release PR
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.RELEASE_CREATOR_TOKEN }}
        run: |
          release-please \
            --token=$TOKEN \
            --repo-url=syntasso/kratix-cli \
            release-pr
